backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "src/uploads"
public_folder: "/uploads"

locale: "es"

collections:
  - name: "blog"
    label: "Blog CIAJ"
    folder: "src/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    editor:
      preview: false
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción SEO", name: "description", widget: "text", required: true }
      - { label: "Extracto", name: "excerpt", widget: "text", required: true }
      - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - "Cobranza especializada"
          - "Siniestros y fiscalías"
          - "Multas y autoridades"
          - "Contratos de transporte"
          - "Carta Porte"
          - "Grúas y servicios auxiliares"
          - "ValiMax"
          - "Prevención de riesgos"
      - { label: "Imagen destacada", name: "image", widget: "image", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }
